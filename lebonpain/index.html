<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le bon pain - Application de rencontre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Le bon pin</h1>
        <p>Rencontres modernes, simples et bienveillantes.</p>
    </header>

    <main class="container">

        <!-- Création de profil -->
        <section class="card">
            <h2>Créer ton profil</h2>
            <form id="profileForm">
                <div class="field">
                    <label>Pseudo</label>
                    <input type="text" id="pseudo" placeholder="Ton pseudo" required>
                </div>

                <div class="field">
                    <label>Âge</label>
                    <input type="number" id="age" min="18" max="99" required>
                </div>

                <div class="field">
                    <label>Ville</label>
                    <input type="text" id="ville" placeholder="Ta ville" required>
                </div>

                <div class="field">
                    <label>Intention</label>
                    <select id="intention" required>
                        <option value="">Choisis...</option>
                        <option value="sérieux">Relation sérieuse</option>
                        <option value="amitié">Amitié</option>
                        <option value="sorties">Sorties & fun</option>
                    </select>
                </div>

                <button type="submit">Enregistrer mon profil</button>
            </form>
            <p id="profileStatus" class="status"></p>
        </section>

        <!-- Liste des profils -->
        <section class="card">
            <h2>Explorer les profils</h2>

            <div class="filters">
                <input type="text" id="filterVille" placeholder="Filtrer par ville">
                <select id="filterIntention">
                    <option value="">Intention (toutes)</option>
                    <option value="sérieux">Relation sérieuse</option>
                    <option value="amitié">Amitié</option>
                    <option value="sorties">Sorties & fun</option>
                </select>
                <button id="btnFilter">Filtrer</button>
            </div>

            <div id="profilesList" class="profiles"></div>
        </section>

        <!-- Match basique -->
        <section class="card">
            <h2>Match rapide</h2>
            <p>On te propose un profil compatible avec ton intention.</p>
            <button id="btnMatch">Trouver un bon pin</button>
            <div id="matchResult" class="match"></div>
        </section>

    </main>

    <footer class="footer">
        <p>Le bon pin — prototype étudiant, prêt à évoluer.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
